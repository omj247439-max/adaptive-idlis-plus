<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0713">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ToolBox — calculators, creator tools aur aur bhi bahut kuch</title>
<meta name="description" content="Ek jagah par sab kaam ke tools — calculators, QR, image, text aur PDF tools. Free, fast, bina sign-up ke.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0713;
    --panel:rgba(28,18,46,0.55);
    --ink:#f5f0ff;
    --ink-dim:#b6a6d9;
    --ink-faint:#7c6a9c;
    --line:rgba(216,180,255,0.14);
    --line-strong:rgba(216,180,255,0.30);
    --violet:#a855f7;
    --violet-2:#7c3aed;
    --violet-bright:#cf9bff;
    --glow:rgba(168,85,247,0.55);
    --glow-soft:rgba(168,85,247,0.25);
    --radius:20px;
    --maxw:1080px;
  }
  *{box-sizing:border-box;}
  html{color-scheme:dark;}
  body{
    margin:0;color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;font-size:16px;line-height:1.55;
    -webkit-font-smoothing:antialiased;background:var(--bg);
    background-image:
      radial-gradient(circle at 18% 0%, rgba(124,58,237,0.28) 0%, transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(168,85,247,0.16) 0%, transparent 40%);
    background-attachment:fixed;min-height:100vh;
  }
  .disp{font-family:'Outfit',sans-serif;font-weight:700;}
  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--violet);color:#fff;}
  :focus-visible{outline:2px solid var(--violet-bright);outline-offset:2px;}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px;}

  @keyframes glowPulse{ 0%,100%{ box-shadow:0 0 10px var(--glow-soft);} 50%{ box-shadow:0 0 22px var(--glow);} }
  @media (prefers-reduced-motion: reduce){ .brand .mark{animation:none !important;} }

  header.site{
    position:sticky;top:0;z-index:30;background:rgba(10,7,19,0.75);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .nav{display:flex;align-items:center;justify-content:center;padding:16px 0;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .mark{
    width:34px;height:34px;border-radius:11px;
    background:linear-gradient(135deg, var(--violet), var(--violet-2));
    color:#fff;display:flex;align-items:center;justify-content:center;
    font-family:'Outfit',sans-serif;font-weight:800;font-size:16px;flex-shrink:0;
    animation:glowPulse 3.2s ease-in-out infinite;
  }
  .brand .word{font-family:'Outfit',sans-serif;font-weight:700;font-size:19px;color:var(--ink);}
  .brand .word span{color:var(--violet-bright);}

  main{padding:44px 0 70px;}
  .hero{text-align:center;margin-bottom:40px;}
  .hero h1{font-size:clamp(30px,6vw,46px);margin:0 0 12px;line-height:1.15;color:var(--ink);}
  .hero p{color:var(--ink-dim);font-size:16.5px;max-width:52ch;margin:0 auto;}

  .app-grid{display:grid;grid-template-columns:1fr;gap:16px;}
  .app-card{
    background:var(--panel);backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,0.07);border-radius:var(--radius);
    box-shadow:0 14px 34px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.05);
    padding:26px 24px;display:flex;align-items:center;gap:20px;
    transition:transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  }
  .app-card.live{cursor:pointer;}
  .app-card.live:hover{transform:translateY(-4px);border-color:rgba(168,85,247,0.5);box-shadow:0 18px 40px rgba(0,0,0,0.6), 0 0 24px var(--glow-soft);}
  .app-card.soon{opacity:0.55;}
  .app-icon{
    width:56px;height:56px;border-radius:15px;display:flex;align-items:center;justify-content:center;
    background:rgba(168,85,247,0.15);border:1px solid rgba(168,85,247,0.35);font-size:26px;flex-shrink:0;
  }
  .app-info{flex:1;min-width:0;}
  .app-info .name{font-family:'Outfit',sans-serif;font-weight:700;font-size:19px;color:var(--ink);}
  .app-info .desc{font-size:13.5px;color:var(--ink-dim);margin-top:4px;}
  .app-tag{
    font-size:11px;color:var(--violet-bright);border:1px solid rgba(168,85,247,0.4);
    padding:3px 9px;border-radius:20px;flex-shrink:0;white-space:nowrap;
  }
  .app-tag.soon-tag{color:var(--ink-faint);border-color:var(--line-strong);}
  .app-arrow{color:var(--violet-bright);font-size:19px;flex-shrink:0;}

  footer.site{border-top:1px solid var(--line);padding:26px 0 40px;text-align:center;color:var(--ink-faint);font-size:13px;}
</style>
</head>
<body>

<header class="site">
  <div class="wrap nav">
    <div class="brand">
      <span class="mark">🧰</span>
      <span class="word">Tool<span>Box</span></span>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="hero">
    <h1 class="disp">Sab kaam ke tools, ek jagah.</h1>
    <p>Calculators se lekar creator earnings tak — jo bhi chahiye, yahan milega. Free, fast, bina sign-up ke.</p>
  </div>

  <div class="app-grid">
    <a href="hisaabbox.html" class="app-card live">
      <div class="app-icon">₹</div>
      <div class="app-info">
        <div class="name">HisaabBox</div>
        <div class="desc">Finance, creator earnings, student aur health — 31 calculators, ek jagah.</div>
      </div>
      <span class="app-tag">Live</span>
      <span class="app-arrow">→</span>
    </a>
  </div>
</main>

<footer class="site">ToolBox — naye tools banne ke saath yahan add hote rahenge.</footer>

</body>
</html>
